name: Build and Push Docker Image

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: wsofdan
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version tag
        id: version
        run: |
          TAG=$(git tag --sort=-creatordate --list 'v*' | head -1)
          if [ -z "$TAG" ]; then TAG="v0.1.0-beta"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          case "$TAG" in v1.*) echo "latest=true" >> $GITHUB_OUTPUT ;; *) echo "latest=false" >> $GITHUB_OUTPUT ;; esac

      - name: Docker meta
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: wsofdan/kids-star
          flavor: |
            latest=false
          tags: |
            type=raw,value=beta
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync version tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f "${{ steps.version.outputs.tag }}" HEAD
          git push origin "${{ steps.version.outputs.tag }}" --force