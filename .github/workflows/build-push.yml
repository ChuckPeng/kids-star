name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: wsofdan
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: wsofdan/kids-star
          tags: |
            type=raw,value=beta,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v1.') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync version tag (branch only)
        if: github.ref_type == 'branch'
        run: |
          VER_TAG=$(git tag --sort=-creatordate --list v* | head -1)
          if [ -z "$VER_TAG" ]; then VER_TAG="v0.1.0-beta"; fi
          git tag -f "$VER_TAG" HEAD
          git push origin "$VER_TAG" --force
